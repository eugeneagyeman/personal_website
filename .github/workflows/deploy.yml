name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm install` rather than `npm ci`. The lock file is generated on macOS,
      # so it does not contain the linux-x64 variants of the optional native
      # dependencies that Tailwind pulls in, and `npm ci` fails on them with
      # "Missing: @emnapi/core from lock file". npm has no supported way to
      # generate a lock file covering every platform.
      - name: Install dependencies
        run: |
          npm install --global npm@11
          npm install

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
