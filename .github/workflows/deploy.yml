name: Deploy

on:
  push:
    branches: [main]
    # Only changes that can alter the built site trigger a deploy. Prose-only
    # files (README, DESIGN, PRODUCT) are documentation about the repo, not
    # inputs to it, and should not wait on a production approval.
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare secrets live on the `production` environment, not at repo
    # level. Environment secrets are only injected into jobs that pass the
    # environment's protection rules, so with a required reviewer configured
    # every deploy waits for manual approval — a push (or a malicious workflow
    # edit) alone can no longer reach the token.
    environment: production

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm install` rather than `npm ci`. The lock file is generated on macOS,
      # so it does not contain the linux-x64 variants of the optional native
      # dependencies that Tailwind pulls in, and `npm ci` fails on them with
      # "Missing: @emnapi/core from lock file". npm has no supported way to
      # generate a lock file covering every platform.
      #
      # `--omit=dev`: the build needs only production dependencies (astro,
      # tailwind, mdx), and wrangler-action supplies its own wrangler. This also
      # keeps dev tools such as Playwright — which downloads browser binaries on
      # install — out of CI.
      - name: Install dependencies
        run: |
          npm install --global npm@11
          npm install --omit=dev

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Assets-only deploys (no `main` in wrangler.jsonc) need wrangler 4;
          # the action otherwise installs wrangler 3, which fails with
          # "Missing entry-point".
          wranglerVersion: '4'
