name: Deploy

on:
  push:
    branches: [main]
    # Only changes that can alter the built site trigger a deploy. Prose-only
    # files (README, DESIGN, PRODUCT) are documentation about the repo, not
    # inputs to it, and should not wait on a production approval.
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds with no access to the Cloudflare secrets. Splitting the build from
  # the deploy is the point: environment secrets are exposed to every step in
  # a job that targets the environment, so a job that both installs
  # dependencies and holds the token gives any compromised package's install
  # script a chance to read it. Nothing secret is in scope here.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      # `npm install` rather than `npm ci`. The lock file is generated on macOS,
      # so it does not contain the linux-x64 variants of the optional native
      # dependencies that Tailwind pulls in, and `npm ci` fails on them with
      # "Missing: @emnapi/core from lock file". npm has no supported way to
      # generate a lock file covering every platform.
      #
      # `--omit=dev`: the build needs only production dependencies (astro,
      # tailwind, mdx). This also keeps dev tools such as Playwright — which
      # downloads browser binaries on install — out of CI.
      - name: Install dependencies
        run: |
          npm install --global npm@11
          npm install --omit=dev

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The only job that sees the Cloudflare credentials, and it does nothing but
  # fetch the artifact the build already produced — no checkout of third-party
  # code, no dependency installation, no build scripts.
  deploy:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare secrets live on the `production` environment, not at repo
    # level. Environment secrets are only injected into jobs that pass the
    # environment's protection rules, so with a required reviewer configured
    # every deploy waits for manual approval.
    environment: production

    steps:
      # wrangler-action needs the repo present to read wrangler.jsonc, so the
      # deploy job checks out too — but it installs nothing and runs no build
      # scripts, which is what keeps third-party code away from the secrets.
      - name: Check out for wrangler config
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Must come after the checkout: actions/checkout cleans the workspace by
      # default and would delete an artifact downloaded before it.
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Assets-only deploys (no `main` in wrangler.jsonc) need wrangler 4;
          # the action otherwise installs wrangler 3, which fails with
          # "Missing entry-point".
          wranglerVersion: '4'